## Sovereignty Policy — machine-readable source of truth
##
## Companion to DEPENDENCY_LEDGER.md (the human-readable ledger, which explains
## the reasoning). This file is what `tools/sovereignty_check.py` enforces in CI.
## The two must not drift: `sovereignty_check.py --check-ledger` fails if any
## name declared here is missing from the ledger prose.
##
## Build Map ticket #1. Bible SS1.2.
##
## THE TEST APPLIED TO EVERY ENTRY:
##   "If this library vanished tomorrow, is what remains still our optimization
##    engine?"  YES -> permitted.  NO -> forbidden.
##
## Three tiers, because the binary permitted/forbidden split loses real cases:
##   permitted  - a numerical primitive. Linear algebra, plumbing, test infra.
##   restricted - dual-use. Permitted ONLY inside declared path scopes; a hit
##                outside those scopes is a violation. This is the tier that
##                keeps the benchmark oracle (#2) from leaking into the core,
##                and keeps fill-reducing ordering separate from the structure
##                detection we must own (#14).
##   forbidden  - an optimization solver, or an algorithm that IS one of our
##                differentiators. Never linked, forked, or vendored.

schema_version = 1

[meta]
ticket = "#1"
gate = "M0"
bible_ref = "SS1.2, Part VII"
ledger = "DEPENDENCY_LEDGER.md"

# ---------------------------------------------------------------------------
# What gets scanned.
# ---------------------------------------------------------------------------
[scan]
include_globs = [
  "CMakeLists.txt",
  "**/CMakeLists.txt",
  "**/*.cmake",
  "**/*.cpp", "**/*.cc", "**/*.cu", "**/*.cuh",
  "**/*.h", "**/*.hpp", "**/*.hip",
  "**/*.py",
  "pyproject.toml", "requirements*.txt", "constraints*.txt",
  "vcpkg.json", "conanfile.txt", "conanfile.py",
  "environment.yml", "environment.yaml",
  "Makefile", "**/Makefile", "meson.build", "**/meson.build",
  ".gitmodules",
  "**/*.pc",
  # Shell scripts are scanned too. A build or setup script is exactly where a
  # forbidden dependency enters unnoticed -- `git clone`, `apt install`, a
  # downloaded tarball -- and none of that appears in a CMake manifest.
  "**/*.sh", "**/*.bash",
]

# Excluded because they legitimately NAME the forbidden things: the ledger, this
# policy, the checker, and its tests. Everything else is fair game.
exclude_globs = [
  ".git/**",
  "DEPENDENCY_LEDGER.md",
  "sovereignty.toml",
  "tools/sovereignty_check.py",
  "tools/test_sovereignty_check.py",
  "Sovereign_Solver_Bible.md",
  "Sovereign_Solver_Build_Map.md",
  "problemStatement.md",
  "HANDOFF.md",
  "README.md",
  "build/**", "**/build/**",
  "**/__pycache__/**",
  # Out-of-tree benchmark oracle: tools/oracle/install_highs.sh builds the HiGHS
  # CLI here. HiGHS is FORBIDDEN as a library; permitted ONLY as a black-box CLI
  # subprocess under the Oracle rule (DEPENDENCY_LEDGER.md S4, Bible Part VII).
  # Its source/build tree must be invisible to this scan and to the solver's
  # CMake -- if build-oracle/ vanished, the check and every solver test still
  # pass, which is the proof it is scaffolding and not a dependency.
  "build-oracle/**",
  # Downloaded benchmark corpora (ticket #2). Only benchmarks/smoke/ is
  # committed; benchmarks/data/ and benchmarks/.tools/ are fetched artefacts.
  "benchmarks/data/**",
  "benchmarks/.tools/**",
]

# Directory names that mean "vendored third-party source lives here". Any
# subdirectory of one of these whose name matches a forbidden entry is a
# violation even if no manifest mentions it -- catches a raw source drop.
vendor_dirs = ["third_party", "thirdparty", "extern", "external", "vendor", "deps", "subprojects"]

