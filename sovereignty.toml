# ===========================================================================
# EXCEPTIONS -- known-safe token collisions. Every entry needs a reason;
# the checker refuses to run on an unjustified exception.
# ===========================================================================

# --- CUDA toolkit probing: a cached variable for a component we never use ---
[[exceptions]]
token = "metis"
paths = ["<depgraph>/CMakeCache.txt"]
reason = "find_package(CUDAToolkit) caches a variable for every optional library of every CUDA component it can find on the system, including cuSOLVER's optional static METIS dependency (CUDA_cusolver_metis_static_LIBRARY), regardless of whether the project actually asked for that component. src/CMakeLists.txt links only CUDA::cudart, CUDA::cublas and CUDA::cusparse -- cuSOLVER is never requested, and nothing in this project ever links METIS outside src/l0/**. The cached path (/usr/lib/x86_64-linux-gnu/libmetis_static.a) is a system package on the build machine that CMake's probe happened to notice, not a dependency this project draws on. Confirmed by inspecting the actual link line: no cusolver, no metis. Scoped strictly to the synthetic <depgraph>/CMakeCache.txt path so a real METIS reference in source or a manifest still fails as before."

[[exceptions]]
token = "cplex"
paths = ["benchmarks/fetch_corpus.py", "benchmarks/data/**"]
reason = "The Netlib LP readme records, for a handful of instances, a reference optimal value that differs from the MINOS 5.3 value and attributes it to CPLEX. fetch_corpus.py parses that published number into the oracle reference table (field 'optimal_value_cplex'). This is reading a citation, not depending on CPLEX -- no CPLEX code, binary, or invocation is involved."

# --- Oracle harness: naming solver executables to run them as subprocesses ---
# The oracle wrapper's entire job is to shell out to an established solver over
# files on disk (Oracle rule, DEPENDENCY_LEDGER.md S5.5). It therefore has to
# name those executables. This is the sanctioned use -- a subprocess, never a
# link -- so the names are excepted, but ONLY inside the oracle harness and its
# tests. Anywhere else in the tree these remain hard violations. Note the scope
# does NOT cover other forbidden names: adding `gurobipy` under tools/oracle/
# would still fail the build.
[[exceptions]]
token = "highs"
paths = ["tools/oracle/**", "tools/check_parser_vs_oracle.py",
         "tools/check_simplex_vs_oracle.py", "tools/check_pdhg_vs_oracle.py",
         "tests/test_oracle.py", "cmake/Oracle.cmake"]
