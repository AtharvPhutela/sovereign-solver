# M0-gate CI: sovereignty (#1), corpus + oracle (#2), L0 substrate (#3).
#
# NOTE ON GPU COVERAGE: GitHub's standard runners have no CUDA toolkit and no
# ROCm, so src/l0/backend_cuda.cu and src/l0/backend_hip.cpp are NOT compiled
# here. The parity check below is what guards them against interface drift in
# the meantime; it is not a substitute for building them. Compiling those two
# files requires a GPU-equipped runner and is an open item.
name: m0-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sovereignty:
    name: dependency sovereignty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # a forbidden library could be hiding in one

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # tomllib needs >= 3.11

      # The checker guards the project's disqualifying constraint, so it is
      # itself tested before it is trusted. A broken checker that returns
      # "clean" is worse than no checker at all.
      - name: Self-test the checker
        run: python3 tools/test_sovereignty_check.py

      - name: Scan manifests, source, submodules and vendored trees
        run: python3 tools/sovereignty_check.py --check-ledger --verbose

      # Configure so CMakeCache.txt / build.ninja exist, then scan the RESOLVED
      # dependency graph. This is the pass that catches a forbidden library
      # arriving transitively, which no manifest would show.
      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Scan the resolved dependency graph
        run: python3 tools/sovereignty_check.py --cmake-build-dir build --check-ledger --verbose

      # Belt and braces: the check is also wired into the default build target,
      # so this fails on a violation even if the explicit steps above changed.
      - name: Build (runs the in-build sovereignty target)
        run: cmake --build build

      # Backends that were not compiled cannot drift silently.
      - name: L0 backend interface parity (#3)
        run: python3 tools/check_backend_parity.py --verbose

      # Ticket #2 + #3 suites. Network-free; the real-solver and downloaded-
      # corpus parts skip cleanly when absent.
      - name: Test suites
        run: ctest --test-dir build --output-on-failure

      # Both index widths must build and pass: int32 is the default, but a
      # large instance needs int64 and that path must not rot.
      - name: Build and test with 64-bit indices (#3)
        run: |
          cmake -S . -B build64 -G Ninja -DSOVEREIGN_INDEX64=ON
          cmake --build build64
          ctest --test-dir build64 --output-on-failure -L l0

      - name: Phase 0 gate
        run: tools/verify_phase0.sh build
